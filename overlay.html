
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Observer X | Tournament HUD</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
<link rel="stylesheet" href="phase3.css">
<script type="module" src="phase3-overlay.js"></script>
<!-- Observer X Phase 3.2 -->
<link rel="stylesheet" href="phase32.css">
<script type="module" src="phase32-overlay.js"></script>
<!-- PHASE 3.4 - OBS TIMER -->
<link rel="stylesheet" href="phase34.css">
<script type="module" src="phase34-overlay.js"></script>
<!-- PHASE 3.5 - CUSTOM PLAYER ICONS -->
<link rel="stylesheet" href="phase35.css">
<!-- PHASE 3.6 - PLAYER HUD CUSTOMIZER -->
<link rel="stylesheet" href="phase36.css">
<script type="module" src="phase36-overlay.js"></script>
</head>
<body>
  <main id="stage">

    <!-- 左右に分割したスコアボード -->
    <header class="scoreboard">
      <div class="score-group team-a">
        <div class="team-info">
          <span class="team-side" id="teamASide"></span>
          <strong class="team-name" id="teamAName"></strong>
        </div>
        <div class="score" id="teamAScore"></div>
      </div>

      <div class="score-group team-b">
        <div class="score" id="teamBScore"></div>
        <div class="team-info">
          <span class="team-side" id="teamBSide"></span>
          <strong class="team-name" id="teamBName"></strong>
        </div>
      </div>
    </header>

    <!-- 中央下側にマップ情報 -->
    <div class="map-info" id="mapInfo"></div>

    <!-- 選手情報 -->
    <section class="roster roster-a" id="rosterA"></section>
    <section class="roster roster-b" id="rosterB"></section>

    <!-- 大会情報 -->
    <div class="event-banner">
      <span id="eventName"></span>
      <span id="matchInfo"></span>
    </div>

    <div class="demo-label" id="demoLabel">
      DEMO DATA
    </div>
  </main>
</body>
</html>
